name: "Build and Upload Artifact"
run-name: "Build: ${{ github.ref_name }}, Run ID: #${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy to?'
        default: 'uat'
        required: true
        type: choice
        options:
          - uat
          - prod


jobs:
  build-and-upload:
    name: 'Build and Upload'
    environment: ${{ github.event.inputs.deploy_env }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Git to branch: ${{ github.ref_name }}"
        uses: actions/checkout@v4
        with:
          ref: "${{ github.ref_name }}"
      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
            ui/yarn.lock
      - name: "Install Dependencies in root folder"
        run: yarn install --frozen-lockfile
      - name: "Install Dependencies in server/ folder"
        run: |
          cd server && yarn install --frozen-lockfile
      - name: "Install Dependencies in ui/ folder"
        run: |
          cd ui && yarn install --frozen-lockfile
      - name: "Create ui/ .env"
        env:
          UI_ENV: ${{ secrets.UI_ENV }}
        run: |
          printf '%s' "$UI_ENV" > ui/.env
      - name: "Create server/ .env"
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          printf '%s' "$SERVER_ENV" > server/.env
      - name: "Build ui/ folder"
        run: |
          cd ui && yarn run build
        env:
          CI: false
      - name: "Move build files to Express client folder"
        run: |
          mkdir server/client && mv ui/build/* server/client
      - name: "Delete ui folder to save storage"
        run: |
          rm -rf ui
      - name: "Zip everything"
        run: |
          zip release.zip ./* -r -q
      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: my_artifact
          path: release.zip
          retention-days: 1
      - name: Inspect artifact
        run: |
          ls -l
          file release.zip
      - name: "Trigger Deploy ${{ github.event.inputs.deploy_env }} Workflow"
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_ENV: ${{ github.event.inputs.deploy_env }}
        run: |
          jq -n --arg ref "$REF_NAME" --arg runId "$RUN_ID" --arg env "$DEPLOY_ENV" \
            '{ref: $ref, inputs: {runId: $runId, env: $env}}' |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-and-delete-workflow.yml/dispatches" \
            -d @-
